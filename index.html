<title>김태일 ♥ 신부이름 결혼합니다</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500&display=swap">
<style>
/* 레이아웃: 휴대폰 폭 한 줄 세로 카드. 흰 바탕 + 번트 오렌지 포인트 한 가지 색, 단일 테마(청첩장 종이 느낌) */
:root{
  --paper:#fffdfb;
  --page:#f1eeeb;
  --ink:#2a2624;
  --muted:#8b8380;
  --line:#ebe5e1;
  --accent:#d9661f;
  --accent-soft:#fbeee5;
  --sun:#d9534f;
  --display:"Playfair Display", "Times New Roman", Georgia, serif;
  --serif:"Noto Serif KR", "AppleMyungjo", serif;
  --sans:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.85;-webkit-font-smoothing:antialiased}
.card{max-width:440px;margin:0 auto;background:var(--paper);overflow:hidden}
section{padding-block:72px;padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px));text-align:center}
h2{font-family:var(--sans);font-weight:500;font-size:17px;color:var(--accent);margin:0 0 28px;letter-spacing:.02em}
.eyebrow{font-family:var(--display);font-style:italic;font-size:14px;color:var(--accent);letter-spacing:.06em;margin:0 0 6px;opacity:.75}

/* 히어로 */
.hero{padding-block:44px 40px;position:relative}
.hero-word{font-family:var(--display);font-weight:400;color:var(--accent);line-height:.9;letter-spacing:-.02em;margin:0;position:relative;z-index:2;font-size:clamp(56px,17vw,78px)}
.hero-frame{position:relative;width:64%;margin:-18px auto -22px;aspect-ratio:2/3;max-width:100%;z-index:1}
.hero-frame img{width:100%;height:100%;object-fit:cover;display:block}
.side{position:absolute;top:50%;font-size:10px;letter-spacing:.22em;color:var(--accent);writing-mode:vertical-rl;transform:translateY(-50%);font-weight:400;white-space:nowrap}
.side.l{left:max(18px, env(safe-area-inset-left, 0px));transform:translateY(-50%) rotate(180deg)}
.side.r{right:max(18px, env(safe-area-inset-right, 0px))}
.hero-date{margin-top:26px;font-size:11px;letter-spacing:.24em;color:var(--accent);font-weight:500}

/* 인사말 */
.quote{font-family:var(--serif);color:var(--accent);font-size:17px;margin:0 0 28px}
.greeting p{margin:0;white-space:pre-line;font-size:15px}
.divider{width:28px;height:1px;background:var(--line);margin:40px auto}
.family{display:grid;gap:10px;font-size:15px}
.family .rel{color:var(--muted);font-size:13px;margin:0 2px}
.family b{font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:999px;padding:10px 22px;font:inherit;font-size:14px;font-weight:400;cursor:pointer;margin-top:30px;text-decoration:none}
.btn:focus-visible,.acc summary:focus-visible,.nav a:focus-visible,.thumbs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 날짜 */
.date-big{font-family:var(--display);font-size:30px;letter-spacing:.04em;margin:0}
.date-sub{color:var(--muted);margin:2px 0 28px;font-size:14px}
.cal{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:16px;display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;font-size:14px;font-variant-numeric:tabular-nums;font-weight:400}
.cal span{height:34px;display:grid;place-items:center}
.cal .hd{color:var(--muted);font-size:13px}
.cal .sun{color:var(--sun)}
.cal .sat{color:var(--ink)}
.cal .on{background:var(--accent);color:#fff;border-radius:50%;width:34px;margin:0 auto;font-weight:500}
.count{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-top:34px;font-variant-numeric:tabular-nums}
.count div{display:grid;gap:2px;min-width:48px}
.count small{font-family:var(--display);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.count strong{font-family:var(--display);font-size:26px;font-weight:400}
.count i{font-style:normal;color:var(--muted);padding-bottom:4px}
.dday{margin-top:16px;font-size:14px}
.dday em{font-style:normal;color:var(--accent);font-weight:500}

/* 갤러리 */
.gallery{padding-left:0;padding-right:0}
.stage{position:relative;aspect-ratio:2/3;background:var(--line);max-width:100%}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s}
.stage .arrow{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:28px;padding:12px;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.stage .prev{left:4px}.stage .next{right:4px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:3px}
.thumbs button{padding:0;border:0;aspect-ratio:1;cursor:pointer;opacity:.55;background:none}
.thumbs button.on{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* 오시는 길 */
.place-name{font-size:18px;font-weight:500;margin:0}
.place-addr{color:var(--muted);margin:2px 0 0;font-size:14px}
.mapbox{margin:26px 0 0;border:1px solid var(--line);aspect-ratio:16/10;display:grid;place-items:center;background:
  repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px),var(--paper);max-width:100%}
.pin{display:grid;gap:4px;justify-items:center;color:var(--accent);font-size:13px;font-weight:500}
.pin svg{width:30px;height:30px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-top:0}
.nav a{padding:13px 4px;font-size:13px;color:var(--ink);text-decoration:none;font-weight:400}
.nav a+a{border-left:1px solid var(--line)}
.ways{text-align:left;margin-top:34px;display:grid;gap:24px}
.ways h3{margin:0 0 4px;font-size:14px;font-weight:500;color:var(--accent)}
.ways p{margin:0;font-size:14px;white-space:pre-line}

/* 계좌 */
.note{color:var(--muted);font-size:14px;margin:-12px 0 28px;white-space:pre-line}
.acc{border:1px solid var(--line);margin-top:10px;text-align:left;background:var(--paper)}
.acc summary{list-style:none;cursor:pointer;padding:15px 18px;font-weight:400;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:8px;height:8px;border-right:1px solid var(--muted);border-bottom:1px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.acc[open] summary::after{transform:rotate(-135deg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);background:#fcf9f7}
.row div{min-width:0;font-size:14px;line-height:1.6}
.row .who{color:var(--muted);font-size:12px}
.row .num{font-variant-numeric:tabular-nums;word-break:break-all}
.copy{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}

/* 마무리 */
.closing{padding-left:0;padding-right:0;padding-bottom:0}
.closing img{width:100%;display:block}
.closing .line{font-family:var(--display);font-style:italic;color:var(--accent);font-size:22px;margin:36px 0 0}
.share{padding-block:36px 56px}
footer{font-size:11px;color:var(--muted);padding-block:0 32px;text-align:center}

/* 연락처 모달 */
.modal{position:fixed;inset:0;background:rgba(30,24,20,.55);display:grid;place-items:center;z-index:20;padding:20px}
.sheet{background:var(--paper);width:100%;max-width:360px;padding:28px 22px;text-align:left}
.sheet h3{margin:0 0 16px;text-align:center;font-weight:500;color:var(--accent);font-size:16px}
.sheet .grp{margin-top:14px}
.sheet .grp>p{margin:0 0 4px;font-size:12px;color:var(--muted)}
.sheet .row{background:none;padding:10px 0;border-top:1px solid var(--line)}
.sheet .close{display:block;margin:22px auto 0}

.toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;z-index:30}

/* 벚꽃잎 · 배경음악 */
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
.music{position:fixed;top:calc(14px + env(safe-area-inset-top, 0px));right:max(14px, calc(50% - 220px + 14px), env(safe-area-inset-right, 0px));z-index:16;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,253,251,.88);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 2px 10px rgba(80,40,20,.08)}
.music svg{width:18px;height:18px}
.music.on svg{animation:spin 6s linear infinite}
.music:not(.on)::after{content:"";position:absolute;width:22px;height:1.5px;background:var(--accent);transform:rotate(-45deg)}
.music:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.music-hint{position:fixed;top:calc(22px + env(safe-area-inset-top, 0px));right:max(62px, calc(50% - 220px + 62px));z-index:16;font-size:11px;color:var(--accent);background:rgba(255,253,251,.92);padding:3px 10px;border-radius:999px;border:1px solid var(--line);transition:opacity .4s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.music.on svg{animation:none}}
</style>

</head>
<body>
<div class="card">
  <!-- 히어로 -->
  <section class="hero">
    <span class="side l" data-k="brideEn"></span>
    <span class="side r" data-k="groomEn"></span>
    <p class="hero-word">The</p>
    <p class="hero-word">Wedding</p>
    <div class="hero-frame"><img src="img/p4.jpg" alt="꽃 아치 앞의 신랑과 신부"></div>
    <p class="hero-word">Day</p>
    <p class="hero-date" id="heroDate"></p>
  </section>

  <!-- 인사말 -->
  <section class="greeting">
    <p class="quote" data-k="quote"></p>
    <p data-k="greeting"></p>
    <div class="divider"></div>
    <div class="family" id="family"></div>
    <button class="btn" type="button" id="openContact">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2.1z"/></svg>
      연락하기
    </button>
  </section>

  <!-- 날짜 -->
  <section>
    <p class="date-big" id="dateBig"></p>
    <p class="date-sub" id="dateSub"></p>
    <div class="cal" id="cal"></div>
    <div class="count" aria-live="off">
      <div><small>DAYS</small><strong id="cD">0</strong></div><i>:</i>
      <div><small>HOUR</small><strong id="cH">00</strong></div><i>:</i>
      <div><small>MIN</small><strong id="cM">00</strong></div><i>:</i>
      <div><small>SEC</small><strong id="cS">00</strong></div>
    </div>
    <p class="dday" id="dday"></p>
  </section>

  <!-- 갤러리 -->
  <section class="gallery">
    <p class="eyebrow">Gallery</p>
    <h2>웨딩 갤러리</h2>
    <div class="stage" id="stage">
      <img id="stageImg" src="img/p1.jpg" alt="">
      <button class="arrow prev" type="button" aria-label="이전 사진" id="prev">‹</button>
      <button class="arrow next" type="button" aria-label="다음 사진" id="next">›</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <!-- 오시는 길 -->
  <section>
    <p class="eyebrow">Location</p>
    <h2>오시는 길</h2>
    <p class="place-name" data-k="venue"></p>
    <p class="place-addr"><span data-k="address"></span><br>Tel. <span data-k="venueTel"></span></p>
    <div class="mapbox">
      <div class="pin">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span data-k="venue"></span>
      </div>
    </div>
    <div class="nav">
      <a id="navNaver" target="_blank" rel="noopener">네이버지도</a>
      <a id="navKakao" target="_blank" rel="noopener">카카오맵</a>
      <a id="navTmap" target="_blank" rel="noopener">티맵</a>
    </div>
    <div class="ways" id="ways"></div>
  </section>

  <!-- 마음 전하실 곳 -->
  <section>
    <p class="eyebrow">With Heart</p>
    <h2>마음 전하실 곳</h2>
    <p class="note">참석이 어려우신 분들을 위해
계좌번호를 기재하였습니다.
너그러운 마음으로 양해 부탁드립니다.</p>
    <details class="acc"><summary>신랑측</summary><div id="accGroom"></div></details>
    <details class="acc"><summary>신부측</summary><div id="accBride"></div></details>
  </section>

  <!-- 마무리 -->
  <section class="closing">
    <img src="img/p3.jpg" alt="샹들리에 아래에서 손을 흔드는 신랑과 신부">
    <p class="line" data-k="closing"></p>
  </section>
  <section class="share">
    <button class="btn" type="button" id="copyLink" style="margin-top:0">청첩장 링크 복사하기</button>
  </section>
  <footer data-k="footer"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt">연락하기</h3>
    <div id="contacts"></div>
    <button class="btn close" type="button" id="closeContact">닫기</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<canvas id="petals" aria-hidden="true"></canvas>
<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
<button class="music" id="musicBtn" type="button" aria-label="배경음악 켜기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
</button>
<span class="music-hint" id="musicHint">화면을 터치하면 음악이 나와요</span>

<script>
/* ===== 여기만 바꾸면 청첩장 전체 내용이 바뀝니다 ===== */
const CONFIG = {
  groom: "김태일", groomEn: "TAEIL KIM",
  bride: "신부이름", brideEn: "BRIDE NAME",
  groomParents: ["신랑아버지", "신랑어머니"], groomRel: "아들",
  brideParents: ["신부아버지", "신부어머니"], brideRel: "딸",
  // 예식 일시 (시간은 임시값)
  date: "2027-03-14T12:30:00+09:00",
  timeText: "일요일 낮 12시 30분",
  quote: "“서로의 가장 좋은 친구가 되어”",
  greeting: `인사말은 내용 받는 대로 채워 넣을게요.
여러 줄로 써도 줄바꿈이 그대로 보입니다.

저희 두 사람의 새로운 시작을
축복해 주시면 감사하겠습니다.`,
  venue: "예식장 이름", address: "예식장 주소", venueTel: "000-000-0000",
  ways: [
    ["지하철 이용 시", "노선 / 출구 안내"],
    ["버스 이용 시", "하차 정류장 안내"],
    ["자가용 이용 시", "내비게이션에 \"예식장 이름\" 입력"],
    ["주차 안내", "주차 위치 / 무료 시간 안내"],
  ],
  contacts: {
    groom: [["신랑", "김태일", "010-0000-0000"], ["신랑 아버지", "신랑아버지", "010-0000-0000"], ["신랑 어머니", "신랑어머니", "010-0000-0000"]],
    bride: [["신부", "신부이름", "010-0000-0000"], ["신부 아버지", "신부아버지", "010-0000-0000"], ["신부 어머니", "신부어머니", "010-0000-0000"]],
  },
  accounts: {
    groom: [["김태일", "은행명", "000-0000-0000"], ["신랑아버지", "은행명", "000-0000-0000"], ["신랑어머니", "은행명", "000-0000-0000"]],
    bride: [["신부이름", "은행명", "000-0000-0000"], ["신부아버지", "은행명", "000-0000-0000"], ["신부어머니", "은행명", "000-0000-0000"]],
  },
  closing: "The two shall become one",
  photos: [
    ["img/p1.jpg", "핑크 드레스와 베이지 수트 차림으로 마주 보며 웃는 두 사람"],
    ["img/p2.jpg", "한옥 창가에서 손으로 눈가를 가리고 내다보는 두 사람"],
    ["img/p3.jpg", "샹들리에 아래 복도에서 손을 흔드는 두 사람"],
    ["img/p4.jpg", "꽃 아치 앞에서 주먹을 든 신랑과 부케를 든 신부"],
  ],
};
/* ================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2, "0");
const C = CONFIG;
C.footer = `${C.groom} ♥ ${C.bride}`;
document.querySelectorAll("[data-k]").forEach(el => el.textContent = C[el.dataset.k] ?? "");
document.title = `${C.groom} ♥ ${C.bride} 결혼합니다`;

const wd = new Date(C.date);
const MONTHS = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const kst = new Date(wd.getTime() + 9 * 3600e3); // 표시는 한국 시간 기준
const Y = kst.getUTCFullYear(), M = kst.getUTCMonth(), D = kst.getUTCDate();
$("#heroDate").textContent = `${D} ${MONTHS[M]} ${Y}`;
$("#dateBig").textContent = `${Y}.${pad(M + 1)}.${pad(D)}`;
$("#dateSub").textContent = C.timeText;

$("#family").innerHTML =
  `<div>${esc(C.groomParents.join(" · "))}<span class="rel">의 ${esc(C.groomRel)}</span> <b>${esc(C.groom)}</b></div>` +
  `<div>${esc(C.brideParents.join(" · "))}<span class="rel">의 ${esc(C.brideRel)}</span> <b>${esc(C.bride)}</b></div>`;

// 달력
(function () {
  const heads = ["일","월","화","수","목","금","토"];
  let h = heads.map((d, i) => `<span class="hd ${i === 0 ? "sun" : ""}">${d}</span>`).join("");
  const first = new Date(Date.UTC(Y, M, 1)).getUTCDay();
  const last = new Date(Date.UTC(Y, M + 1, 0)).getUTCDate();
  for (let i = 0; i < first; i++) h += "<span></span>";
  for (let d = 1; d <= last; d++) {
    const dow = (first + d - 1) % 7;
    h += `<span class="${d === D ? "on" : dow === 0 ? "sun" : ""}">${d}</span>`;
  }
  $("#cal").innerHTML = h;
})();

// 디데이 카운트다운
function tick() {
  let diff = wd - Date.now();
  const past = diff < 0; diff = Math.abs(diff);
  const d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1e3) % 60;
  if (past) { $("#cD").textContent = 0; ["#cH","#cM","#cS"].forEach(k => $(k).textContent = "00"); }
  else { $("#cD").textContent = d; $("#cH").textContent = pad(h); $("#cM").textContent = pad(m); $("#cS").textContent = pad(s); }
  const name = `${C.groom.slice(-2)}, ${C.bride.slice(-2)}의 결혼식이`;
  $("#dday").innerHTML = past ? `${esc(name)} <em>${d}일</em> 지났습니다.` : `${esc(name)} <em>${d + 1}일</em> 남았습니다.`;
}
tick(); setInterval(tick, 1000);

// 갤러리
let cur = 0;
const thumbs = $("#thumbs");
thumbs.innerHTML = C.photos.map((p, i) => `<button type="button" aria-label="${i + 1}번째 사진 보기"><img src="${p[0]}" alt=""></button>`).join("");
function show(i) {
  cur = (i + C.photos.length) % C.photos.length;
  const img = $("#stageImg");
  img.src = C.photos[cur][0]; img.alt = C.photos[cur][1];
  [...thumbs.children].forEach((b, k) => b.classList.toggle("on", k === cur));
}
[...thumbs.children].forEach((b, i) => b.onclick = () => show(i));
$("#prev").onclick = () => show(cur - 1);
$("#next").onclick = () => show(cur + 1);
let sx = null;
$("#stage").addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
$("#stage").addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); sx = null; });
show(0);

// 지도 앱 링크
const q = encodeURIComponent(C.venue);
$("#navNaver").href = `https://map.naver.com/p/search/${q}`;
$("#navKakao").href = `https://map.kakao.com/?q=${q}`;
$("#navTmap").href = `https://www.tmap.co.kr/`;
$("#ways").innerHTML = C.ways.map(([t, d]) => `<div><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join("");

// 복사
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 1800); }
function copyText(text, msg) {
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(msg); } catch { toast(text); } ta.remove(); };
  try { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); } catch { fallback(); }
}
const accRows = list => list.map(([n, b, num]) =>
  `<div class="row"><div><span class="who">${esc(b)} · ${esc(n)}</span><br><span class="num">${esc(num)}</span></div><button class="copy" type="button" data-copy="${esc(b + " " + num)}">복사</button></div>`).join("");
$("#accGroom").innerHTML = accRows(C.accounts.groom);
$("#accBride").innerHTML = accRows(C.accounts.bride);

const conRows = list => list.map(([r, n, tel]) =>
  `<div class="row"><div><span class="who">${esc(r)}</span><br>${esc(n)} <span class="num">${esc(tel)}</span></div><button class="copy" type="button" data-copy="${esc(tel)}">번호 복사</button></div>`).join("");
$("#contacts").innerHTML = `<div class="grp"><p>신랑측</p>${conRows(C.contacts.groom)}</div><div class="grp"><p>신부측</p>${conRows(C.contacts.bride)}</div>`;

document.addEventListener("click", e => { const b = e.target.closest("[data-copy]"); if (b) copyText(b.dataset.copy, "복사되었습니다"); });
$("#openContact").onclick = () => { $("#modal").hidden = false; $("#closeContact").focus(); };
$("#closeContact").onclick = () => $("#modal").hidden = true;
$("#modal").onclick = e => { if (e.target.id === "modal") $("#modal").hidden = true; };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").hidden = true; });
$("#copyLink").onclick = () => copyText(location.href.split("#")[0], "청첩장 링크가 복사되었습니다");

// 배경음악: 브라우저가 소리 자동재생을 막아서 첫 터치 때 시작
(function () {
  const a = $("#bgm"), btn = $("#musicBtn"), hint = $("#musicHint");
  a.volume = 0.55;
  let userMuted = false;
  const hideHint = () => { hint.style.opacity = 0; setTimeout(() => hint.hidden = true, 400); };
  const sync = () => { const on = !a.paused; btn.classList.toggle("on", on); btn.setAttribute("aria-label", on ? "배경음악 끄기" : "배경음악 켜기"); if (on) hideHint(); };
  a.addEventListener("play", sync); a.addEventListener("pause", sync);
  const play = () => a.play().catch(() => {});
  play();
  document.addEventListener("pointerdown", e => { if (e.target.closest("#musicBtn")) return; if (!userMuted && a.paused) play(); }, { once: true });
  btn.onclick = () => { if (a.paused) { userMuted = false; play(); } else { userMuted = true; a.pause(); } };
  setTimeout(hideHint, 7000);
})();

// 벚꽃잎 떨어지는 효과
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#petals"), ctx = cv.getContext("2d");
  let W, H;
  const resize = () => { const dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  resize(); addEventListener("resize", resize);
  const COLORS = ["#f9c9d4", "#f6b8c6", "#fbd9e1", "#f3aebf"];
  const COUNT = Math.round(Math.min(34, Math.max(18, innerWidth / 14)));
  const mk = top => ({
    x: Math.random() * W, y: top ? -20 - Math.random() * H * 0.3 : Math.random() * H,
    s: 6 + Math.random() * 7, vy: 0.45 + Math.random() * 0.7, vx: 0.15 + Math.random() * 0.45,
    rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.03,
    flip: Math.random() * 6.28, vf: 0.02 + Math.random() * 0.03,
    sway: Math.random() * 6.28, c: COLORS[(Math.random() * COLORS.length) | 0], o: 0.65 + Math.random() * 0.3
  });
  const ps = Array.from({ length: COUNT }, () => mk(false));
  function petal(p) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.cos(p.flip)) * 0.8 + 0.2);
    ctx.globalAlpha = p.o; ctx.fillStyle = p.c; const s = p.s;
    ctx.beginPath(); ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * 0.9, -s * 0.7, s * 0.8, s * 0.6, 0, s);
    ctx.bezierCurveTo(-s * 0.8, s * 0.6, -s * 0.9, -s * 0.7, -s * 0.18, -s * 0.85);
    ctx.lineTo(0, -s * 0.6); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      p.sway += 0.012; p.x += p.vx + Math.sin(p.sway) * 0.6; p.y += p.vy;
      p.rot += p.vr; p.flip += p.vf;
      if (p.y > H + 20 || p.x > W + 30) ps[i] = mk(true);
      petal(p);
    }
    requestAnimationFrame(loop);
  })();
})();
</script>
